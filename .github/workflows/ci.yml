name: CI / CD Pipeline

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-and-test:
    name: Build & Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ ubuntu-latest, windows-latest ]
    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Setup .NET SDK
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x'

    - name: Restore Dependencies
      run: dotnet restore TokenVector.Numerics.sln

    - name: Build Solution (Release)
      run: dotnet build TokenVector.Numerics.sln --configuration Release --no-restore

    - name: Run Unit Tests (Release)
      run: dotnet test TokenVector.Numerics.sln --configuration Release --no-build --verbosity normal --collect:"XPlat Code Coverage"

  publish-packages:
    name: Package & Publish to GitHub Packages
    needs: build-and-test
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      packages: write
      contents: read
    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Setup .NET SDK
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x'

    - name: Pack NuGet Package (Release)
      run: dotnet pack src/TokenVector.Numerics/TokenVector.Numerics.csproj --configuration Release --output ./nupkg

    - name: Push to GitHub Packages
      run: dotnet nuget push "./nupkg/*.nupkg" --source "https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json" --api-key ${{ secrets.GITHUB_TOKEN }} --skip-duplicate
      continue-on-error: true
