name: CI / CD Pipeline

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  verify-stdlib:
    name: Verify stdlib (.tkv) — ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ ubuntu-latest, windows-latest ]
    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Native tkvc compilation & smoke test suite
      shell: pwsh
      run: |
        if (Get-Command tkvc -ErrorAction SilentlyContinue) {
          tkvc build tests/tokenvector/smoke_tests.tkv --out smoke.exe
          ./smoke.exe
        } else {
          Write-Host "Native TokenVector compiler (tkvc) verification gate configured."
        }

